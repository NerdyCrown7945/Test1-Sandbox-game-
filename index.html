<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Eco Sandbox Evolution Engine</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="top-bar">
        <div class="tabs">
          <button data-tab="tab-materials" class="active">Materials</button>
          <button data-tab="tab-life">Life</button>
          <button data-tab="tab-environment">Environment</button>
          <button data-tab="tab-evolution">Evolution</button>
          <button data-tab="tab-debug">Debug</button>
        </div>
        <div class="env-controls">
          <label>Season
            <select id="seasonSelect">
              <option value="spring">spring</option>
              <option value="summer">summer</option>
              <option value="fall">fall</option>
              <option value="winter">winter</option>
            </select>
          </label>
          <label>Temperature <input type="range" id="tempRange" min="-20" max="60" value="22" /></label>
          <label>Rainfall <input type="range" id="rainRange" min="0" max="1" step="0.01" value="0.3" /></label>
          <label>Speed <input type="range" id="speedRange" min="0.5" max="4" step="0.1" value="1" /></label>
        </div>
      </header>

      <main class="workspace">
        <aside class="left-panel">
          <h3>Materials Palette</h3>
          <div id="materialsPalette"></div>
        </aside>

        <section class="sim-panel">
          <canvas id="sandboxCanvas" width="960" height="576"></canvas>

          <div class="tab-content">
            <section id="tab-materials" class="tab-panel active">
              <p>환경을 그리며 토양/수분/독성 기반 생태 지형을 구성하세요.</p>
            </section>
            <section id="tab-life" class="tab-panel">
              <p>우측 Life Palette에서 종을 추가해 먹이사슬과 종 다양성을 실험하세요.</p>
            </section>
            <section id="tab-environment" class="tab-panel">
              <ul id="climateEvents"></ul>
            </section>
            <section id="tab-evolution" class="tab-panel">
              <p>진화 트리: microbe → primitive organism → predator class → apex predator</p>
            </section>
            <section id="tab-debug" class="tab-panel">
              <button id="toggleDebug">디버그 토글</button>
              <button id="toggleRL">RL 모드 토글</button>
              <label>성능 모드
                <select id="performanceMode">
                  <option value="balanced">Balanced</option>
                  <option value="performance">Performance</option>
                </select>
              </label>
            </section>
          </div>
        </section>

        <aside class="right-panel">
          <h3>Life Forms Palette</h3>
          <div id="lifePalette"></div>
        </aside>
      </main>

      <footer class="bottom-bar">
        <span>FPS: <strong id="fps">0</strong></span>
        <span>개체수: <strong id="entityCount">0</strong></span>
        <span>평균 유전자값(Intelligence): <strong id="avgGene">0</strong></span>
        <span>진화 상태: <strong id="evoStatus">조건 미충족</strong></span>
      </footer>
    </div>

    <script type="module" src="app.js"></script>
  </body>
</html>
