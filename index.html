<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>2D 폴링샌드 샌드박스</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app">
      <header class="controls">
        <label>
          물질
          <select id="materialSelect"></select>
        </label>

        <label>
          브러시 크기
          <input id="brushSize" type="range" min="1" max="20" value="6" />
          <span id="brushSizeValue">6</span>
        </label>

        <div class="mode-toggle">
          <button id="drawModeBtn" class="active">생성</button>
          <button id="eraseModeBtn">삭제</button>
        </div>

        <button id="pauseBtn">일시정지</button>
        <button id="clearBtn">초기화</button>

        <label>
          속도
          <input id="speedRange" type="range" min="1" max="6" value="2" />
          <span id="speedValue">2x</span>
        </label>

        <button id="interactionsBtn">설명/도감</button>
        <div class="status">FPS: <span id="fps">0</span></div>
      </header>

      <main>
        <canvas id="sandboxCanvas" width="800" height="600"></canvas>
      </main>
    </div>

    <div id="interactionsModal" class="modal hidden" aria-hidden="true">
      <div class="modal-content">
        <div class="modal-header">
          <h2>물질 상호작용 도감</h2>
          <button id="closeModalBtn">닫기</button>
        </div>
        <div class="modal-body">
          <section>
            <h3>물질 속성</h3>
            <table>
              <thead>
                <tr>
                  <th>물질</th>
                  <th>카테고리</th>
                  <th>밀도</th>
                  <th>거동</th>
                  <th>특징</th>
                </tr>
              </thead>
              <tbody id="materialsTableBody"></tbody>
            </table>
          </section>

          <section>
            <h3>상호작용 규칙 (코드와 동기화)</h3>
            <table>
              <thead>
                <tr>
                  <th>규칙</th>
                  <th>트리거</th>
                  <th>결과</th>
                </tr>
              </thead>
              <tbody id="rulesTableBody"></tbody>
            </table>
          </section>

          <section>
            <h3>물질별 소개 / 변화 규칙</h3>
            <div id="materialCards" class="material-cards"></div>
          </section>
        </div>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
